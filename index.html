<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos de futbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input type="search" id="buscador" placeholder="Buscar por equipo o estadio">

    <select id="filtroCompeticion">
      <option value="PL">Premier League</option>
      <option value="PD">La Liga</option>
      <option value="SA">Serie A</option>
      <option value="BL1">Bundesliga</option>
      <option value="FL1">Ligue 1</option>
      <option value="CL">Champions League</option>
    </select>

    <select id="filtroPais">
      <option value="">Todos los paises</option>
    </select>
  </header>

  <p id="mensaje"></p>

  <main class="equipos-container" id="equiposContainer"></main>

  <section class="agregar-equipo">
    <form id="agregarEquipoForm">
      <h2>Agregar equipo</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="estadio">Estadio</label>
      <input type="text" id="estadio" required>

      <label for="pais">Pais</label>
      <input type="text" id="pais" required>

      <button type="submit">Agregar</button>
    </form>
  </section>

  <script src="./main.js"></script>
</body>
</html>
