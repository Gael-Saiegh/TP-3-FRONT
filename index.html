<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos de futbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input type="search" id="buscador" class="buscador" placeholder="Buscar por equipo o estadio">

    <select id="filtroLiga" class="select"></select>

    <select id="ordenar" class="select">
      <option value="nombre">Ordenar por nombre</option>
      <option value="fundacion">Ordenar por fundacion</option>
    </select>
  </header>

  <p id="mensaje" class="mensaje"></p>

  <main class="equipos-container" id="equiposContainer"></main>

  <section class="agregar-equipo">
    <form id="agregarEquipoForm">
      <h2>Agregar equipo</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="estadio">Estadio</label>
      <input type="text" id="estadio" required>

      <label for="pais">Pais</label>
      <input type="text" id="pais" required>

      <button type="submit">Agregar</button>
    </form>
  </section>

  <script src="./main.js"></script>
</body>
</html>
