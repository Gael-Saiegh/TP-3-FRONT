<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos de futbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="buscador-caja">
      <img src="lupita.png" alt="lupita-foto" class="buscador-icono">
      <input type="search" id="buscador" class="buscador" placeholder="Buscar por equipo o estadio">
    </div>

    <select id="filtroLiga" class="select"></select>

    <select id="ordenar" class="select">
      <option value="nombre">Ordenar por nombre</option>
      <option value="fundacion">Ordenar por fundacion</option>
    </select>
  </header>

  <p id="mensaje" class="mensaje"></p>

  <main class="equipos-container" id="equiposContainer"></main>

  <section class="agregar-equipo">
    <h2>Agregar equipo</h2>

    <form id="agregarEquipoForm">
      <div class="campo">
     
        <input type="text" id="nombre" required placeholder="ingrese el nombre del equipo">
      </div>

      <div class="campo">
        <input type="text" id="estadio" required placeholder="ingrese el nombre de su estadio">
      </div>

      <div class="campo">
        
        <input type="text" id="pais" required placeholder="ingrese el pais del equipo">
      </div>

    
      <button type="submit">Agregar</button>
    </form>
  </section>

  <script src="./main.js"></script>
</body>
</html>
